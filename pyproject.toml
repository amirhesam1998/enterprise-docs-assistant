[project]
name = "enterprise-docs-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bcrypt>=4.0,<4.1",
    "celery>=5.6.3",
    "fastapi>=0.139.2",
    "ollama>=0.6.2",
    "openpyxl>=3.1.5",
    "passlib[bcrypt]>=1.7.4",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.18.0",
    "rank-bm25>=0.2.2",
    "redis>=8.0.1",
    "sentence-transformers>=5.6.0",
    "sqlalchemy>=2.0",
    # Declared directly (rather than left transitive via sentence-transformers)
    # so the CPU-only pin in [tool.uv.sources] below actually applies to it.
    "torch>=2.13.0",
    "uvicorn>=0.51.0",
]

# torch is pinned to the CPU-only wheels on purpose. Nothing in this project uses
# CUDA: embedding and reranking run on CPU, and the one heavy generation step
# (Ollama) runs outside Docker entirely. The default PyPI torch would drag ~3.3GB
# of CUDA/nvidia wheels into the API image for no benefit.
# To build a GPU image instead, drop this index + source pair and re-run `uv lock`.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eda"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
